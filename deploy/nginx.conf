# Szablon nginx dla Garmin Pulpit.
# Plik trafia do /etc/nginx/templates/default.conf.template — oficjalny obraz nginx
# podstawia ${BACKEND_URL} przy starcie kontenera.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Backend FastAPI. Bez ukośnika na końcu — ścieżka /api/... jest zachowana.
    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Klucz wpisany w Ustawieniach aplikacji przekazujemy bez zmian.
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Service worker i manifest muszą być zawsze świeże.
    location = /service-worker.js {
        expires -1;
        try_files $uri =404;
    }

    location = /manifest.json {
        expires -1;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    # Hashed assety Vite — mogą być cache'owane na rok.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location /icons/ {
        expires 7d;
        try_files $uri =404;
    }

    # SPA fallback (routing oparty o hash, ale fallback jest bezpieczny).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
